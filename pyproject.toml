[project]
name = "pyvcs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "cynarski", email = "cynarski60@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.1.1",
    "setuptools>=84.0.0",
]

[project.scripts]
pyvcs = "pyvcs.cli:main"

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
]
markers = [
    "unit: isolated unit tests",
    "integration: integration tests using multiple components",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
